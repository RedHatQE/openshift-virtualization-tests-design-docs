name: 'Close stale issues and PRs'
on:
  schedule:
    - cron: '30 1 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      # actions: write — lets actions/stale cache its processing position and resume
      #   after its 30-operation limit on the next scheduled run
      # contents: write — required by delete-branch to delete branches of closed PRs
      # issues/pull-requests: write — label, comment on, and close issues and PRs
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v10
        with:
          stale-pr-message: 'This PR is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-pr-message: 'This PR was closed because it remained inactive for 7 days after being marked stale.'
          stale-issue-message: 'This Issue is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 7 days.'
          close-issue-message: 'This Issue was closed because it remained inactive for 7 days after being marked stale.'
          days-before-stale: 30
          days-before-close: 7
          delete-branch: true
          close-pr-label: "Closed-Stale-PR"
          close-issue-label: "Closed-Stale-Issue"
          # PRs/issues awaiting a maintainer decision (e.g. missed-deadline exception
          # reviews) are protected from stale processing via the 'hold' label
          exempt-pr-labels: "hold"
          exempt-issue-labels: "hold"
