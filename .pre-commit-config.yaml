# Pre-commit hooks for OpenShift Virtualization test documentation
# See https://pre-commit.com for more information

repos:
  - repo: local
    hooks:
      - id: check-stp-moves
        name: Check STP move stubs
        entry: tools/check_stp_moves.py
        language: python
        pass_filenames: false
        files: ^stps/.*\.md$
      - id: test-stp-moves
        name: Test STP move validator
        entry: tools/test_check_stp_moves.py
        language: python
        pass_filenames: false
        files: ^(stps/.*\.md|tools/check_stp_moves\.py|tools/test_check_stp_moves\.py|\.pre-commit-config\.yaml)$

  # Markdownlint for Markdown file linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        files: \.md$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: "v8.30.0"
    hooks:
      - id: gitleaks
