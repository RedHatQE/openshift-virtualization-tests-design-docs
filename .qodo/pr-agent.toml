# Qodo Merge (PR-Agent) configuration for openshift-virtualization-tests-design-docs
# This is a documentation-only repo containing Software Test Plans (STPs).
# Review standards are defined in AGENTS.md — mirror of .coderabbit.yaml.

[pr_reviewer]
# Docs-only repo — no code to test or scan for code-level security practices
require_tests_review = false
require_security_best_practices_review = false
require_estimate_effort_to_review = false
enable_help_text = false
enable_review_line_status = true
num_code_suggestions = 3
extra_instructions = """
Review STPs for content quality and template compliance per AGENTS.md.
Be direct. Explain WHY. Use severity: CRITICAL (blocks approval), HIGH (must fix),
MEDIUM (should fix), LOW (suggestion).

Core principles:
- STPs describe what users experience, not internal implementation. Flag API field
  names, CRD names, or internal component references as findings.
- Every claim needs evidence — sign-offs, Jira links, dates. No empty placeholders
  ("[TBD]", "[Name/Date]", "[Add details]") in approved STPs.
- Distinguish constraint categories: Feature Limitations, Test Limitations, Out of
  Scope, and Risks are four distinct concepts — flag any mixing.
- Traceability is mandatory — every test scenario must map to a Jira requirement ID
  with tier and priority.
- Testing goals must be written from the end-user perspective with priorities
  (P0 first), and each P0 goal needs a matching negative/failure-path scenario.
- Test scenarios need observable pass criteria, not "verify X works correctly".

For files under stps/stp-template/ — those are templates, not feature STPs. Skip
STP content review for them; only check markdown formatting.
"""

[pr_description]
publish_labels = false
generate_ai_title = false
enable_semantic_files_info = false
extra_instructions = """
The PR description must summarize what changed in the STP(s) in terms of test
coverage impact: scenarios added/removed/modified, priority or tier changes,
scope changes (Out of Scope, Test Limitations), and sign-off updates. Reference
the Jira feature tracking links found in the STP metadata when present.
"""

[best_practices]
# Docs-only repo — disable code-oriented best-practice checks
commits_best_practices_check = false
empty_collections_check = false
imported_code_identifiers_check = false
naming_check = false
relative_url_check = false
# Markdown hygiene checks that still apply
uppercase_constants_check = false
suspicious_comments_check = true
