# Tier 3: extended validation - higher execution cost rather than wider scope.
# Generates, deliberately.
#
# Caveat worth knowing when a Tier 3 test is generated: nothing a layer can set makes
# the generated test carry @pytest.mark.tier3. tier*.yaml `markers` is in the
# schema's allowlist but no consumer reads it, and the one marker path that reaches
# generated code (the project's `scenario_tiers`) is auto mode only. An unmarked test
# is stamped tier2 by the test suite's conftest.py, so a generated Tier 3 test lands
# in the tier2 lane until the marker is added by hand at review.
#
# A SIG adds `description`, and `reference_tests` where a genuine Tier 3 module
# exists.
enabled: true
tier: "Tier 3"
display_name: "Extended Validation"
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs/blob/main/docs/testing-tiers.md"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
