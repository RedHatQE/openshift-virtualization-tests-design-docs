# Tier 3: extended validation - higher execution cost rather than wider scope.
# A label only, for a different reason than Tier 1.
#
# Tier 3 tests do exist and carry @pytest.mark.tier3 by hand. What a layer cannot do
# is make a *generated* test carry that marker: tier*.yaml `markers` is in the
# schema's allowlist but no consumer reads it, and the one marker path that does
# reach generated code is the project's `scenario_tiers`, which applies in auto mode
# only. An unmarked test is stamped tier2 by conftest.py, so a generated Tier 3 test
# would run in the tier2 lane - worse than not generating for cost-heavy work.
#
# A SIG adds `description`, and `reference_tests` where a genuine Tier 3 module
# exists.
enabled: false
tier: "Tier 3"
display_name: "Extended Validation"
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs/blob/main/docs/testing-tiers.md"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
