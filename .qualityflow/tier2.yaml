# Tier 2: complete user workflows, end to end. The tier that generates.
#
# A SIG adds `description` and a `reference_tests` entry pointing at a test in the
# test suite's directory for that SIG; where no module is a genuine exemplar, the
# SIG sets `reference_tests: null`, because an omitted key inherits whatever a
# lower layer carries while null unsets it.
#
# `conftest.py` in the test suite adds the team and tier2 markers from the test's
# directory, so a generated test must not repeat them.
enabled: true
tier: "Tier 2"
display_name: "End-to-End"
language: "python"
framework: "pytest"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests/blob/main/docs/SOFTWARE_TEST_DESCRIPTION.md"
imports:
  framework:
    - "pytest"
test_patterns:
  function_prefix: "test_"
  class_prefix: "Test"
  assertion_style: "assert"
