# yaml-language-server: $schema=https://raw.githubusercontent.com/redhat-community-ai-tools/qualityflow/main/schemas/qualityflow.schema.json
# QualityFlow layer for this repository's stps/ tree.
#
# The CNV project config (config/projects/cnv) already sets tier mode, the three
# tier shapes and the component map, so this layer adds nothing of its own: it
# exists so the SIG layers under stps/sig-<sig>/ have a layer above them, and to
# assert which project they configure. Everything else is inherited.
version: 1
project_id: "cnv"
