# Tier 1: a single feature in isolation. A label only for STP purposes.
#
# enabled: false is deliberate. Tier 1 tests are Go/Ginkgo in kubevirt/kubevirt,
# and /generate-tests resolves a Go target to primary_repo, which is the Python
# test suite rather than the product. The file still earns its place:
# tier-classifier is given every tier*.yaml to build the list of available tiers,
# not only the enabled ones, which is what keeps [Tier 1] a label an STP scenario
# can carry.
#
# Consequence: a Tier 1 scenario produces no stub and no test. stub-generator
# reports "N scenarios have no matching language config" for it. Expected output,
# not a defect to chase.
#
# A SIG adds `description`, and `reference_tests` where its upstream Go package
# exists.
enabled: false
tier: "Tier 1"
display_name: "Functional"
language: "go"
framework: "ginkgo-v2"
build_tags:
  - "functional"
reference_guide: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs/blob/main/docs/testing-tiers.md"
imports:
  dot_imports:
    - "github.com/onsi/ginkgo/v2"
    - "github.com/onsi/gomega"
  project:
    - "kubevirt.io/kubevirt/tests/decorators"
    - "kubevirt.io/kubevirt/tests/framework/kubevirt"
    - "kubevirt.io/kubevirt/tests/testsuite"
test_patterns:
  function_prefix: "It"
  assertion_style: "gomega"
