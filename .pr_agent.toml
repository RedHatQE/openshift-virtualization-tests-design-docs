# Qodo Merge (PR-Agent) configuration for openshift-virtualization-tests-design-docs
# This is a documentation-only repo containing Software Test Plans (STPs).
# Review checklist: AGENTS.md. Authoritative references: stps/stp-template/stp.md for structure,
# format and content requirements, docs/stp-guide.md for purpose and process. Mirrors .coderabbit.yaml.

[config]
# Feed repo guidance into Qodo's review context (read from the default branch).
# repo_context_max_lines applies to the COMBINED rendered context of all files,
# not per-file — 2200 covers AGENTS.md (438) + docs/stp-guide.md (269) + docs/testing-tiers.md (210)
# + stps/stp-template/stp.md (486) + stps/stp-template/child-stp.md (218) = ~1620 today, with room to grow.
# The authoritative templates are listed first so an overflow truncates them last.
repo_context_files = ["stps/stp-template/stp.md", "stps/stp-template/child-stp.md", "AGENTS.md", "docs/stp-guide.md", "docs/testing-tiers.md"]
repo_context_max_lines = 2200

[pr_reviewer]
# Docs-only repo — no code to test or scan for code-level security practices
require_tests_review = false
require_security_review = false
require_estimate_effort_to_review = false
enable_help_text = false
extra_instructions = """
Review STPs for content quality and template compliance (stps/stp-template/stp.md, or
stps/stp-template/child-stp.md for a child STP; checklist in AGENTS.md).
Be direct. Explain WHY. Use severity: CRITICAL (blocks approval), HIGH (must fix),
MEDIUM (should fix), LOW (suggestion).

Core principles:
- The template structure is fixed: a feature STP fills stps/stp-template/stp.md (child STPs:
  stps/stp-template/child-stp.md) and never extends it. An added, renamed, reordered, or
  non-conditional removed section, checklist item, field, or Section III key is CRITICAL and blocks
  approval; so is field-shaped content inside a field (an extra bold or italic label, a
  `Key: value` line, a group heading, a table). See AGENTS.md "Template Structure Compliance".
  A structure change belongs in a separate template PR.
- STPs describe what users experience, not internal implementation. Flag internal API
  field names, internal component references, and implementation mechanisms as findings.
  Documented user-facing objects the user must create or edit (e.g. a resource kind)
  may be named.
- Every claim needs evidence — sign-offs, Jira links, dates. No empty placeholders
  ("[TBD]", "[Name/Date]", "[Add details]") in approved STPs.
- Distinguish constraint categories: Feature Limitations, Test Limitations, Out of
  Scope, and Risks are distinct concepts — flag any mixing.
- Traceability is mandatory — every test scenario must map to a Jira requirement ID
  with tier and priority. Section III scenarios are required for non-regression Testing
  Goals; a regression goal and an acceptance criterion may be satisfied by named existing
  regression coverage in Test Strategy.
- Testing goals must be written from the end-user perspective with priorities
  (P0 first), and each P0 functional goal needs a negative/failure-path Testing Goal with a matching
  scenario (or an Out of Scope entry with Quality Owner or Product Manager sign-off); regression goals are covered by Test Strategy.
- Test scenarios need observable pass criteria, not "verify X works correctly".

For files under stps/stp-template/ — those are templates, not feature STPs. Skip
feature-STP content review for them (no requirements, acceptance-criteria, or scenario
checks) and check markdown formatting, but apply the template-PR gate from AGENTS.md
"Template Structure Compliance": the PR must not silently remove a section, field,
checklist item, or Section III key that is not listed as conditional — a rename or a
documented replacement is allowed, an unexplained deletion is not. When a template PR
changes structure or shared rule guidance it must update both templates, AGENTS.md,
docs/stp-guide.md, and the .coderabbit.yaml structure block together where the item
exists in both; flag a PR that leaves one of those copies behind. A typo, wording, or
comment-only template edit that leaves fields and rules unchanged is exempt — do not
flag it for a missing rule-copy update. Check the template instructions are self-consistent, and
report any place where docs/stp-guide.md or AGENTS.md disagrees with the template so the other
document can be corrected.

Follow stps/stp-template/stp.md (child STPs: stps/stp-template/child-stp.md) as the
authoritative reference for STP structure, format and content requirements; docs/stp-guide.md explains the purpose
of each part, the constraint categories, and the lifecycle; docs/testing-tiers.md defines the
tier classification.
When a review question is answered by those docs, cite them.

Cross-check STP accuracy against linked sources: the STP metadata links the
VEP/design doc (Enhancement(s)) and the Jira feature tracking issue (Feature
Tracking / Epic Tracking). When a linked source is accessible, verify the STP's
requirements, acceptance criteria, and scope against it. Flag: requirements in
the STP that are absent from the VEP/epic, acceptance criteria narrower than the
epic's scope, and feature maturity/phase mismatches between the STP and the
linked source. If a link cannot be fetched (e.g. Jira requires authentication),
state explicitly in the review that the STP could not be verified against that
source — do not silently skip the cross-check.

For a child STP, check inherited feature-wide requirements, acceptance criteria and coverage
against the parent STP; the child lists only SIG-specific ones. Do not flag a child STP for
omitting content that docs/stp-guide.md (Multi-SIG Features and Child STPs) lists as parent-owned.
"""

[pr_description]
publish_labels = false
generate_ai_title = false
enable_semantic_files_types = false
extra_instructions = """
The PR description must summarize what changed in the STP(s) in terms of test
coverage impact: scenarios added/removed/modified, priority or tier changes,
scope changes (Out of Scope, Test Limitations), and sign-off updates. Reference
the Jira feature tracking links found in the STP metadata when present.
"""
