# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI Review Configuration for openshift-virtualization-tests-design-docs
# This is a documentation-only repo containing Software Test Plans (STPs)

language: en-US

tone_instructions: >
  Review STPs for content quality and template compliance.
  Be direct. Explain WHY. Use severity: CRITICAL (blocks approval),
  HIGH (must fix), MEDIUM (should fix), LOW (suggestion).
  See AGENTS.md for the review checklist; stps/stp-template/stp.md is authoritative for structure,
  format and content requirements, docs/stp-guide.md for purpose and process.

early_access: true
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  auto_title_placeholder: "@coderabbitai"
  review_status: true
  commit_status: true
  review_details: true
  poem: false
  collapse_walkthrough: true
  sequence_diagrams: false
  changed_files_summary: true
  abort_on_close: true

  path_instructions:
    - path: "stps/**"
      instructions: |
        ## Fixed template structure (CRITICAL — blocks approval)

        The section structure and the field set of an STP are defined by the templates only:
        `stps/stp-template/stp.md` for feature STPs and `stps/stp-template/child-stp.md` for
        child STPs. A feature STP fills the template — it must never extend it. Full definition:
        the "Template Structure Compliance" section of AGENTS.md.

        Flag as CRITICAL any change to a feature STP that adds, renames, or reorders a section,
        numbered subsection, checklist item, metadata field, a field inside a checklist item, or a
        Section III key — or that removes one which is not conditional, or that splits one field
        into several or nests new keys inside an existing field.

        Also CRITICAL: field-shaped content inside an existing field — a bold or italic label
        followed by `:` and a value (e.g. an invented `*Upstream coverage:*`), a `Key: value` line, a
        standalone bold/italic group heading that introduces a group, or a table column that behaves
        like a field. Emphasis inside a sentence (`**Note:**`) is prose. Inside a field, only plain
        sentences and the template's own lines repeated are allowed — nested, or at the same level for
        the `Document Conventions` term line; any other nested list
        item, ordered list, table, or content-bearing HTML element inside a field is a new field
        (HTML comments excepted). The bracketed labels the template itself defines stay in a filled
        field — `[Jira-ID]` on a Section III entry, `[P0]`/`[P1]`/`[P2]` on a Testing Goal, the
        optional phase tag on a goal as `[P0][TP]` or on a scenario as `- *Priority:* P0 [TP]`, and
        `[Tier N]` at the start of `Test Scenario`; so do markdown link labels, the checklist
        markers `[ ]`/`[x]`, the `Document Conventions` term line, and bracketed placeholders such
        as `[1, 2, or 3]`, which are replaced when the field is filled. Any other bracketed *token
        acting as a key or label* is a new field.

        Concrete additions this repo has had to block: metadata fields `Implementation PR` and
        `Upstream e2e PR`; an invented `III.1` numbered subsection; the per-scenario key `Tier`; the
        Section III keys `Test ID`, `Upstream coverage`, `Downstream required`, `Covered upstream`,
        `Pending (Tier 2 downstream)` and `Gap resolution`; and renamed risk fields such as
        `PM/DEV Sign-off` or `Missing or unavailable environments`.

        Repeating a template line is content, not structure: extra entry criteria, extra risk
        entries inside one category, extra scenarios, requirements, criteria, NFRs, or limitations
        are all allowed.

        Conditional items — the only permitted omissions in a feature STP: `Document Conventions
        (if applicable)`, and the supplemental field plus `Sign-off` line of a risk category that
        has no risk. Template wording like "if applicable", "if needed", or "if separate" never
        licenses deleting a labelled field: `Child STPs` is always present (single-SIG features
        write `None — single-SIG feature`), and every risk category is present (a no-risk category
        keeps its `Mitigation` line).

        Child STPs are graded against `child-stp.md`'s own field set, which has no `Enhancement(s)`,
        `Feature Maturity`, `Owning SIG`, `Participating SIGs`, or `Child STPs` field — it names only
        its own `SIG` — and no `Value`/`Use cases`; they may not extend it either. A child STP keeps
        every risk category too: one with no SIG-specific risk reads `None — [why]`.

        Section III shape: a bullet with the Jira ID bold, the requirement summary as a user story,
        then `Test Scenario` and `Priority` — tier inline as the first token of `Test Scenario`
        (`*Test Scenario:* [Tier N] [scenario]`). A child STP uses the same shape; a separate `Tier`
        key in any STP is a new field, as are the other keys listed above.

        In a filled STP, HTML comments are not part of the document: a comment carrying a field, key,
        or value is CRITICAL structure smuggling, and any other surviving comment is HIGH. This does
        not apply under `stps/stp-template/`, to AGENTS.md or to `docs/*.md` — that is the guidance
        material rather than a filled STP, so a comment there is never a finding.

        Where that content belongs instead: free prose in an existing field, or outside the STP
        (design doc, VEP, tests repository). A structural change must come as a separate PR that
        updates the template it changes, the `Template Structure Compliance` section of AGENTS.md,
        `docs/stp-guide.md`, this block, and the `extra_instructions` in `.pr_agent.toml` — the five
        copies; until that PR merges, the field does not exist and must not appear in any STP. Do not
        suggest adding a field to the template as a fix for one STP.

        A PR must not bundle a dependency: flag CRITICAL when a feature-STP change uses a field,
        key, or section that the same PR adds, renames, or removes in a template, `AGENTS.md`,
        `docs/stp-guide.md`, `.pr_agent.toml`, or this file — equivalently, any PR that changes a
        rule source and an STP in the same diff must be split so the rule cannot be rewritten under
        cover of the STP that benefits from it. An unrelated typo fix in a template is fine.

        For files under `stps/stp-template/`, replace the feature-STP shape check and the comment
        check above with the template-PR gate: the PR must not silently remove a required section or
        field — a rename or a documented replacement is allowed, an unexplained deletion is not.
        When it changes structure or shared rule guidance, it must update the template it changes,
        AGENTS.md, `docs/stp-guide.md`, this block, and `.pr_agent.toml` together — so the five
        copies cannot drift — and apply the change to both templates where the item exists in both.
        A typo, wording, or comment-only template edit that leaves fields and rules unchanged is
        exempt — do not flag it for a missing rule-copy update.

        Already-merged STPs keep the shape they were approved with: template rules are not
        retroactively enforced. The exemption is per entry: entries a PR adds or modifies follow the
        current template, and legacy entries the PR leaves alone are not flagged. Re-shaping a legacy
        entry onto the current template — renaming its fields to the current names — is that required
        update, not a structure change, so do not flag it. Only divergence from the current template
        counts.

        ## Test implementation cross-reference (STP → tests)

        Skip this check entirely for files under `stps/stp-template/` — those are
        templates, not feature STPs.

        When a feature STP file under `stps/` is modified, determine whether the change
        is **meaningful** (affects test implementation) or **cosmetic** (no test impact).

        **Meaningful changes** (flag for test update):
        - Test scenarios added, removed, or modified in Section III (scenario entries changed)
        - Testing goals added, removed, or reprioritized in Section II.1
        - Requirements added, removed, or modified in Section I.1
        - Acceptance criteria added, removed, or changed in Section I.1
        - Tier or priority changes on existing scenarios
        - Scope changes in Section II.1 (Out of Scope items added or removed)
        - Test Limitations changes in Section II.1 that alter what QE can validate
        - Test strategy changes in Section II.2 that affect what is tested
        - Test environment changes in Section II.3 that affect how tests run

        **Cosmetic changes** (skip cross-ref check):
        - Typo fixes, grammar corrections, punctuation changes
        - Formatting or whitespace adjustments
        - Rewording that preserves the same test intent and pass/fail criteria
        - Sign-off updates, sign-off function changes
        - Metadata-only changes (dates, version bumps, document conventions)
        - Risk section updates that do not change test scope

        **When meaningful changes are detected:**

        First, use the linked repository (`RedHatQE/openshift-virtualization-tests`) to check
        whether existing tests reference this STP via `STP:` or `STP Reference:` URLs
        in docstrings (both conventions are used in the tests repo).

        **If no tests reference this STP** (greenfield STP with no test coverage yet),
        skip the cross-reference notice entirely. The tests repo enforces STP-to-test
        alignment when tests land.

        **If tests reference this STP**, post a non-blocking MEDIUM severity advisory listing:
        1. Which sections changed meaningfully (scenarios, goals, criteria, scope)
        2. A summary of what changed (e.g., "2 scenarios added, 1 scenario priority
           changed from P2 to P0, 1 acceptance criterion removed")
        3. A cross-reference notice:

           > **⚠️ Test implementation may need updating.**
           > This STP is linked to tests in
           > [`RedHatQE/openshift-virtualization-tests`](https://github.com/RedHatQE/openshift-virtualization-tests).
           > The following changes may require corresponding test updates:
           > - [list of meaningful changes]
           >
           > Please verify that test coverage in the tests repo reflects these STP changes.
           > If new scenarios were added, new tests or STDs (Software Test Descriptions) may be needed.
           > If scenarios were removed or modified, existing tests may need updating or removal.

        This cross-reference notice is advisory — it should NOT trigger request changes.
        STPs are the source of truth; tests are updated afterward in a follow-up PR to
        the tests repo. If suspected misalignments with existing tests are found, note
        them as questions in the advisory, not as blocking defects.

        **When only cosmetic changes are detected:**
        Do not post the cross-reference notice. Review normally per AGENTS.md.

  auto_review:
    enabled: true
    auto_incremental_review: true
    drafts: false
    ignore_title_keywords:
      - "WIP"
      - "Draft"
    base_branches:
      - main

  tools:
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000

chat:
  auto_reply: true

knowledge_base:
  opt_out: false

  linked_repositories:
    - repository: "RedHatQE/openshift-virtualization-tests"
      instructions: |
        Contains the test implementation (Python/pytest) for features defined
        by STPs in this repository. Tests live under tests/<sig-area>/ and
        reference STPs via STP: URLs in module/class/test docstrings.

        Use this linked repo to:
        - Check whether modified STP scenarios already have test coverage
        - Identify which test files reference a changed STP (search for both
          `STP:` and `STP Reference:` followed by a design-docs GitHub URL)
        - Assess the impact of STP scenario changes on existing tests

  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs/stp-guide.md"
      - "stps/stp-template/stp.md"
      - "stps/stp-template/child-stp.md"

  learnings:
    scope: auto

  issues:
    scope: auto

  pull_requests:
    scope: auto
