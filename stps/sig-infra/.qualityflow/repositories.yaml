# Context repositories for sig-sig-infra.
#
# Read together with the root .qualityflow/repositories.yaml (tests suite,
# design-docs repository, Python client libraries) and this SIG's tier files
# under .qualityflow/. Only the product code, tests or fixtures a sig-sig-infra
# scenario needs to read belong here.
#
# kubevirt/enhancements is declared in every SIG: the VEPs describe the feature
# design behind any repository under the kubevirt org.

additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "ssp-operator"
    org: "kubevirt"
    full_name: "kubevirt/ssp-operator"
    url: "https://github.com/kubevirt/ssp-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "SSP_OPERATOR_REPO_PATH"

  - name: "common-instancetypes"
    org: "kubevirt"
    full_name: "kubevirt/common-instancetypes"
    url: "https://github.com/kubevirt/common-instancetypes"
    default_branch: "main"
    language: "go"
    local_path_env: "COMMON_INSTANCETYPES_REPO_PATH"

  - name: "common-templates"
    org: "kubevirt"
    full_name: "kubevirt/common-templates"
    url: "https://github.com/kubevirt/common-templates"
    default_branch: "master"
    language: "shell"
    local_path_env: "COMMON_TEMPLATES_REPO_PATH"

  - name: "enhancements"
    org: "kubevirt"
    full_name: "kubevirt/enhancements"
    url: "https://github.com/kubevirt/enhancements"
    default_branch: "main"
    language: "markdown"
    local_path_env: "KUBEVIRT_ENHANCEMENTS_REPO_PATH"
