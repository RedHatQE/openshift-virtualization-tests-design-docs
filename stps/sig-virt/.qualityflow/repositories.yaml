# Context repositories for sig-virt.
#
# Read together with the root .qualityflow/repositories.yaml (tests suite,
# design-docs repository, Python client libraries) and this SIG's tier files
# under .qualityflow/. Only the product code, tests or fixtures a sig-virt
# scenario needs to read belong here.

additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "kubevirt-migration-operator"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-migration-operator"
    url: "https://github.com/kubevirt/kubevirt-migration-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_MIGRATION_OPERATOR_REPO_PATH"

  - name: "forklift"
    org: "kubev2v"
    full_name: "kubev2v/forklift"
    url: "https://github.com/kubev2v/forklift"
    default_branch: "main"
    language: "go"
    local_path_env: "FORKLIFT_REPO_PATH"

  - name: "kubevirt-plugin"
    org: "kubevirt-ui"
    full_name: "kubevirt-ui/kubevirt-plugin"
    url: "https://github.com/kubevirt-ui/kubevirt-plugin"
    default_branch: "main"
    language: "typescript"
    local_path_env: "KUBEVIRT_PLUGIN_REPO_PATH"

  - name: "enhancements"
    org: "kubevirt"
    full_name: "kubevirt/enhancements"
    url: "https://github.com/kubevirt/enhancements"
    default_branch: "main"
    language: "markdown"
    local_path_env: "KUBEVIRT_ENHANCEMENTS_REPO_PATH"
