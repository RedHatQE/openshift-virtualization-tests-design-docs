# Context repositories for sig-sig-network.
#
# Read together with the root .qualityflow/repositories.yaml (tests suite,
# design-docs repository, Python client libraries) and this SIG's tier files
# under .qualityflow/. Only the product code, tests or fixtures a sig-sig-network
# scenario needs to read belong here.
#
# kubevirt/enhancements is declared in every SIG: the VEPs describe the feature
# design behind any repository under the kubevirt org.

additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "kubernetes-nmstate"
    org: "nmstate"
    full_name: "nmstate/kubernetes-nmstate"
    url: "https://github.com/nmstate/kubernetes-nmstate"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBERNETES_NMSTATE_REPO_PATH"

  - name: "sriov-network-operator"
    org: "k8snetworkplumbingwg"
    full_name: "k8snetworkplumbingwg/sriov-network-operator"
    url: "https://github.com/k8snetworkplumbingwg/sriov-network-operator"
    default_branch: "master"
    language: "go"
    local_path_env: "SRIOV_NETWORK_OPERATOR_REPO_PATH"

  - name: "ovn-kubernetes"
    org: "openshift"
    full_name: "openshift/ovn-kubernetes"
    url: "https://github.com/openshift/ovn-kubernetes"
    default_branch: "main"
    language: "go"
    local_path_env: "OVN_KUBERNETES_REPO_PATH"

  - name: "enhancements"
    org: "kubevirt"
    full_name: "kubevirt/enhancements"
    url: "https://github.com/kubevirt/enhancements"
    default_branch: "main"
    language: "markdown"
    local_path_env: "KUBEVIRT_ENHANCEMENTS_REPO_PATH"
