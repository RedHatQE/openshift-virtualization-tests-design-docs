# Tier 3 for sig-network.
description: >-
  Network scopes outside standard CI: SR-IOV and DPDK/OVS binding plugins
  needing dedicated hardware, traffic measurement under sustained load or at
  scale, and full multi-NIC matrices. Idle-cluster stuntime on a Linux bridge
  or localnet secondary network stays Tier 2.
reference_tests:
