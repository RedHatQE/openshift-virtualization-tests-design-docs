# Context repositories for sig-sig-storage.
#
# Read together with the root .qualityflow/repositories.yaml (tests suite,
# design-docs repository, Python client libraries) and this SIG's tier files
# under .qualityflow/. Only the product code, tests or fixtures a sig-sig-storage
# scenario needs to read belong here.
#
# kubevirt/enhancements is declared in every SIG: the VEPs describe the feature
# design behind any repository under the kubevirt org.

additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "containerized-data-importer"
    org: "kubevirt"
    full_name: "kubevirt/containerized-data-importer"
    url: "https://github.com/kubevirt/containerized-data-importer"
    default_branch: "main"
    language: "go"
    local_path_env: "CDI_REPO_PATH"

  - name: "kubevirt-velero-plugin"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-velero-plugin"
    url: "https://github.com/kubevirt/kubevirt-velero-plugin"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_VELERO_PLUGIN_REPO_PATH"

  - name: "oadp-operator"
    org: "openshift"
    full_name: "openshift/oadp-operator"
    url: "https://github.com/openshift/oadp-operator"
    default_branch: "oadp-dev"
    language: "go"
    local_path_env: "OADP_OPERATOR_REPO_PATH"

  - name: "vm-file-restore-operator"
    org: "kubevirt"
    full_name: "kubevirt/vm-file-restore-operator"
    url: "https://github.com/kubevirt/vm-file-restore-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "VM_FILE_RESTORE_OPERATOR_REPO_PATH"

  - name: "enhancements"
    org: "kubevirt"
    full_name: "kubevirt/enhancements"
    url: "https://github.com/kubevirt/enhancements"
    default_branch: "main"
    language: "markdown"
    local_path_env: "KUBEVIRT_ENHANCEMENTS_REPO_PATH"
