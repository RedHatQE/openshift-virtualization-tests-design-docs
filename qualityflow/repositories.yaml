# Reference copy of the CNV project's config/projects/cnv/repositories.yaml.
# Read it here; QualityFlow never loads this file. When the two disagree, the
# deployment wins — see qualityflow/README.md.

# The QE test suite (where QF-generated Python tests belong).
primary_repo:
  name: "openshift-virtualization-tests"
  org: "RedHatQE"
  full_name: "RedHatQE/openshift-virtualization-tests"
  url: "https://github.com/RedHatQE/openshift-virtualization-tests"
  local_path_env: "SOURCE_REPO_PATH"
  default_branch: "main"
  language: "python"
  build_system: "uv"
  build_command: "uv run pytest"

repo_files:
  agents_rules:
    repo: "primary_repo"
    path: "AGENTS.md"
    fallback: null
    description: "QE test conventions and generation rules"
  stp_template:
    repo: "design_docs_repo"
    path: "stps/stp-template/stp.md"
    fallback: "templates/stp/stp-template.md"
    description: "Official CNV software test plan template"
  stp_guide:
    repo: "design_docs_repo"
    path: "docs/stp-guide.md"
    fallback: null
    description: "Official CNV software test plan authoring guide"
  testing_tiers:
    repo: "design_docs_repo"
    path: "docs/testing-tiers.md"
    fallback: null
    description: "Official CNV test-tier definitions"
  stp_review_rules:
    repo: "design_docs_repo"
    path: "AGENTS.md"
    fallback: null
    description: "The review checklist CodeRabbit and human reviewers apply to STP PRs"

design_docs_repo:
  name: "openshift-virtualization-tests-design-docs"
  org: "RedHatQE"
  full_name: "RedHatQE/openshift-virtualization-tests-design-docs"
  url: "https://github.com/RedHatQE/openshift-virtualization-tests-design-docs"
  local_path_env: "OPENSHIFT_VIRTUALIZATION_TESTS_DESIGN_DOCS_REPO_PATH"
  default_branch: "main"

# Product under test + the client library the tests build on.
additional_repos:
  - name: "kubevirt"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt"
    url: "https://github.com/kubevirt/kubevirt"
    # Every SIG tier1 reference test for the product lives under this branch.
    default_branch: "main"
    # Without local_path_env the regression-analyzer never looks for a local
    # checkout of this repo (agents/regression-analyzer.md Step 0.1 resolves
    # only entries that declare one), so LSP/grep analysis silently skips the
    # product under test even when the source is present on disk.
    language: "go"
    local_path_env: "KUBEVIRT_REPO_PATH"

  - name: "enhancements"
    org: "kubevirt"
    full_name: "kubevirt/enhancements"
    url: "https://github.com/kubevirt/enhancements"
    default_branch: "main"
    language: "markdown"
    local_path_env: "KUBEVIRT_ENHANCEMENTS_REPO_PATH"

  - name: "openshift-python-wrapper"
    org: "RedHatQE"
    full_name: "RedHatQE/openshift-python-wrapper"
    url: "https://github.com/RedHatQE/openshift-python-wrapper"
    default_branch: "main"
    local_path_env: "OPENSHIFT_PYTHON_WRAPPER_REPO_PATH"
    language: "python"

  - name: "containerized-data-importer"
    org: "kubevirt"
    full_name: "kubevirt/containerized-data-importer"
    url: "https://github.com/kubevirt/containerized-data-importer"
    default_branch: "main"
    language: "go"
    local_path_env: "CDI_REPO_PATH"

  - name: "kubevirt-velero-plugin"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-velero-plugin"
    url: "https://github.com/kubevirt/kubevirt-velero-plugin"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_VELERO_PLUGIN_REPO_PATH"

  - name: "kubevirt-migration-operator"
    org: "kubevirt"
    full_name: "kubevirt/kubevirt-migration-operator"
    url: "https://github.com/kubevirt/kubevirt-migration-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBEVIRT_MIGRATION_OPERATOR_REPO_PATH"

  - name: "vm-file-restore-operator"
    org: "kubevirt"
    full_name: "kubevirt/vm-file-restore-operator"
    url: "https://github.com/kubevirt/vm-file-restore-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "VM_FILE_RESTORE_OPERATOR_REPO_PATH"

  # Repositories a SIG layer's tier1 reference test lives in, added here so the
  # repo-aware steps (LSP, regression analysis) can open a checkout. A checkout
  # is found through the entry's local_path_env when it is exported; when that
  # variable is merely unset they fall back to a common-directory probe
  # (~/src/<repo>, ~/projects/<repo>), checked against the entry's url. An
  # entry that declares no local_path_env at all is skipped outright — see the
  # kubevirt note above. The sixth, containerized-data-importer, is declared
  # above; all six land in the deployment's repositories.yaml only once the
  # companion change there lands (recorded in docs/qualityflow-config.md).
  - name: "hyperconverged-cluster-operator"
    org: "kubevirt"
    full_name: "kubevirt/hyperconverged-cluster-operator"
    url: "https://github.com/kubevirt/hyperconverged-cluster-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "HCO_REPO_PATH"

  - name: "ssp-operator"
    org: "kubevirt"
    full_name: "kubevirt/ssp-operator"
    url: "https://github.com/kubevirt/ssp-operator"
    default_branch: "main"
    language: "go"
    local_path_env: "SSP_OPERATOR_REPO_PATH"

  - name: "common-instancetypes"
    org: "kubevirt"
    full_name: "kubevirt/common-instancetypes"
    url: "https://github.com/kubevirt/common-instancetypes"
    default_branch: "main"
    language: "go"
    local_path_env: "COMMON_INSTANCETYPES_REPO_PATH"

  - name: "kubernetes-nmstate"
    org: "nmstate"
    full_name: "nmstate/kubernetes-nmstate"
    url: "https://github.com/nmstate/kubernetes-nmstate"
    default_branch: "main"
    language: "go"
    local_path_env: "KUBERNETES_NMSTATE_REPO_PATH"

  - name: "sriov-network-operator"
    org: "k8snetworkplumbingwg"
    full_name: "k8snetworkplumbingwg/sriov-network-operator"
    url: "https://github.com/k8snetworkplumbingwg/sriov-network-operator"
    # Default branch is master, not main: the tier1 reference test URL pins it.
    default_branch: "master"
    language: "go"
    local_path_env: "SRIOV_NETWORK_OPERATOR_REPO_PATH"

  # Context repos no tier1 in this repository points at yet. Inert as
  # comments; uncommenting one registers it, which is what lets the
  # repo-aware steps find a checkout at all. Verify its default_branch against
  # GitHub and add its variable to env.example when you activate it.
