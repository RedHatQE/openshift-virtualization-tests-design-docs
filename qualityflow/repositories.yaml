  #   org: "openshift"
  #   full_name: "openshift/ovn-kubernetes"
  #   url: "https://github.com/openshift/ovn-kubernetes"
  #   default_branch: "main"
  #   language: "go"
  #   local_path_env: "OVN_KUBERNETES_REPO_PATH"
  #   # stps/sig-network/EVPN.md links the upstream ovn-kubernetes org, not this
  #   # OpenShift fork — decide which one is wanted before activating.
  #
  # - name: "forklift"
  #   org: "kubev2v"
  #   full_name: "kubev2v/forklift"
  #   url: "https://github.com/kubev2v/forklift"
  #   default_branch: "main"
  #   language: "go"
  #   local_path_env: "FORKLIFT_REPO_PATH"
  #
  # - name: "node-healthcheck-operator"
  #   org: "medik8s"
  #   full_name: "medik8s/node-healthcheck-operator"
  #   url: "https://github.com/medik8s/node-healthcheck-operator"
  #   default_branch: "main"
  #   language: "go"
  #   local_path_env: "NODE_HEALTHCHECK_OPERATOR_REPO_PATH"
  #
  # - name: "oadp-operator"
  #   org: "openshift"
  #   full_name: "openshift/oadp-operator"
  #   url: "https://github.com/openshift/oadp-operator"
  #   default_branch: "oadp-dev"
  #   language: "go"
  #   local_path_env: "OADP_OPERATOR_REPO_PATH"
  #
  # - name: "virt-platform-autopilot"
  #   org: "openshift-virtualization"
  #   full_name: "openshift-virtualization/virt-platform-autopilot"
  #   url: "https://github.com/openshift-virtualization/virt-platform-autopilot"
  #   default_branch: "main"
  #   language: "go"
  #   local_path_env: "VIRT_PLATFORM_AUTOPILOT_REPO_PATH"

pr_url_patterns:
  - "https://github.com/{org}/{repo}/pull/{number}"
